{% extends "base.html" %}
{% block title %}Αλλαγή Κωδικού{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-key"></i> Αλλαγή Κωδικού</h2>
</div>
<div class="card" style="max-width: 480px">
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Τρέχων κωδικός</label>
                <input type="password" name="old_password" class="form-control" required autocomplete="current-password">
            </div>
            <div class="mb-3">
                <label class="form-label">Νέος κωδικός (≥6 χαρακτήρες)</label>
                <input type="password" name="new_password" class="form-control" required autocomplete="new-password">
            </div>
            <div class="mb-3">
                <label class="form-label">Επιβεβαίωση νέου κωδικού</label>
                <input type="password" name="confirm_password" class="form-control" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Αλλαγή</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Ακύρωση</a>
        </form>
    </div>
</div>
{% endblock %}
