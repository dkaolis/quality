{% extends "base.html" %}
{% block title %}Administrator — Ξεκλείδωμα{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-shield-lock"></i> Administrator</h2>
</div>
<div class="card shadow-sm" style="max-width: 460px">
    <div class="card-body p-4">
        <p class="text-muted" style="font-size:0.88rem">
            <i class="bi bi-lock"></i> Η ενότητα «Administrator» είναι κλειδωμένη. Επιβεβαίωσε τον <strong>κωδικό σου</strong> για να συνεχίσεις.
        </p>
        <form method="post" action="{{ url_for('administrator_unlock', next=next) }}">
            <div class="mb-3">
                <label class="form-label">Κωδικός Administrator</label>
                <input type="password" name="password" class="form-control" required autofocus autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-dark w-100"><i class="bi bi-unlock"></i> Ξεκλείδωμα</button>
        </form>
    </div>
</div>
{% endblock %}
