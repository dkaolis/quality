{% extends "base.html" %}
{% block title %}Νοσηλευτήρια{% endblock %}
{% block content %}
<div class="page-header">
    <h2><i class="bi bi-hospital"></i> Νοσηλευτήρια / Διευθύνσεις</h2>
</div>

<div class="card mb-3" style="max-width: 1000px">
    <div class="card-body p-0">
        <table class="table table-hover mb-0 align-middle" style="font-size:0.87rem">
            <thead><tr>
                <th style="width:100px">Κωδικός</th><th>Όνομα</th><th style="width:100px">Σειρά</th>
                <th style="width:90px">Ενεργό</th><th style="width:120px"></th>
            </tr></thead>
            <tbody>
            {% for h in hospitals %}
            <tr>
                <form method="post" action="{{ url_for('admin_hospital_save') }}">
                    <td><strong>{{ h.code }}</strong><input type="hidden" name="code" value="{{ h.code }}"></td>
                    <td><input type="text" name="name_el" class="form-control form-control-sm" value="{{ h.name_el }}"></td>
                    <td><input type="number" name="sort_order" class="form-control form-control-sm" value="{{ h.sort_order }}"></td>
                    <td class="text-center">
                        <input type="checkbox" name="active" class="form-check-input" {% if h.active %}checked{% endif %}>
                    </td>
                    <td>
                        <button type="submit" class="btn btn-sm btn-outline-success"><i class="bi bi-check-lg"></i> Αποθήκευση</button>
                    </td>
                </form>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<div class="card" style="max-width: 1000px">
    <div class="card-header py-2">Νέο νοσηλευτήριο / διεύθυνση</div>
    <div class="card-body">
        <form method="post" action="{{ url_for('admin_hospital_save') }}" class="row g-2">
            <div class="col-md-2">
                <input type="text" name="code" class="form-control form-control-sm" placeholder="Κωδικός" required maxlength="10">
            </div>
            <div class="col-md-6">
                <input type="text" name="name_el" class="form-control form-control-sm" placeholder="Όνομα" required>
            </div>
            <div class="col-md-2">
                <input type="number" name="sort_order" class="form-control form-control-sm" placeholder="Σειρά" value="99">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-sm btn-success"><i class="bi bi-plus-lg"></i> Προσθήκη</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
